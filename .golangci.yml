version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - unconvert
    - unparam
  exclusions:
    generated: strict
    warn-unused: true
    rules:
      # Test fixtures deliberately exercise malformed input and may use values
      # that would be insecure in production code.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Adopt the expanded checks incrementally: existing protocol code stays
  # visible to dedicated audits, while new and changed lines cannot add debt.
  new: true

run:
  relative-path-mode: gomod
  timeout: 5m
