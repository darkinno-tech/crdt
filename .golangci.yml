version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - unconvert
    - unparam
  exclusions:
    generated: strict
    warn-unused: true
    rules:
      # Test fixtures deliberately exercise malformed input and may use values
      # that would be insecure in production code.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Compare the complete beta candidate with its release base. `issues.new`
  # only inspects HEAD~ and misses earlier commits when beta CI cancels stale
  # runs; whole files catch a new issue adjacent to the edited hunk as well.
  new-from-merge-base: origin/main
  whole-files: true

run:
  relative-path-mode: gomod
  timeout: 5m
