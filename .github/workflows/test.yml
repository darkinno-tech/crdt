name: Test

on:
  push:
    branches:
      - beta
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # A beta-to-main PR already has a full push validation for the exact same
    # SHA. Do not spend a second runner on an identical workflow.
    if: github.event_name != 'pull_request' || github.head_ref != 'beta'
    runs-on: ubuntu-latest
    # The complete fuzz suite is intentionally bounded but can still take
    # several minutes. Leave headroom for corpus minimization without allowing
    # a stalled runner to consume the default six-hour allowance.
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Verify generated protocol registry
        run: go generate ./... && git diff --exit-code -- type_ids_generated.go clients/typescript/src/type_ids.generated.ts
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests
        run: go test ./...
      - name: Run TypeScript and Go Wasm compatibility tests
        run: make wasm-test
      - name: Run race detector
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Fuzz decoders (PR smoke)
        if: github.event_name == 'pull_request'
        run: make fuzz-smoke
      - name: Fuzz decoders (release candidate)
        # main is a beta-only release branch. Its merge commit has already
        # received this complete suite on beta; rerunning it would spend a
        # second long-lived runner without exercising new source.
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        run: make fuzz

  staticcheck:
    if: github.event_name != 'pull_request' || github.head_ref != 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: staticcheck-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2026.1"
          min-go-version: "1.26"
          install-go: false
          use-cache: false

  coverage:
    if: github.event_name != 'pull_request' || github.head_ref != 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: coverage-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Enforce per-package coverage
        run: make coverage

  performance:
    # Compare source revisions on one runner. Absolute benchmark values vary
    # across GitHub hosts and must not be treated as capacity guarantees.
    # beta is the release candidate; main is a beta-only merge whose source
    # has already been compared before promotion.
    if: github.ref == 'refs/heads/beta' || (github.event_name == 'pull_request' && github.head_ref != 'beta')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: performance-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Select comparison baseline
        id: baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            baseline="${PR_BASE_SHA}"
          else
            baseline="${PUSH_BEFORE}"
          fi
          if [[ -z "${baseline}" || "${baseline}" =~ ^0+$ ]]; then
            baseline="$(git rev-parse HEAD^)"
          fi
          echo "sha=${baseline}" >> "${GITHUB_OUTPUT}"
      - name: Check out comparison baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: .benchmark-baseline
      - name: Compare controlled benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .benchmark-results
          benchmark_args=(
            -run='^$'
            -bench='^(BenchmarkGCounterApplyDelta|BenchmarkRGAApplyDeltaLinearChain|BenchmarkProviderEndToEndRelayFanout)$'
            -benchmem
            -benchtime=100ms
            -count=5
            -cpu=1
            ./counter
            ./text
            ./examples/websocket-provider/provider
          )
          (
            cd .benchmark-baseline
            GOMAXPROCS=1 go test "${benchmark_args[@]}"
          ) > .benchmark-results/baseline.txt
          GOMAXPROCS=1 go test "${benchmark_args[@]}" > .benchmark-results/candidate.txt
          go run ./cmd/crdt-benchmark-check \
            -base .benchmark-results/baseline.txt \
            -candidate .benchmark-results/candidate.txt \
            -minimum-samples 5 \
            -max-time-regression 1.00 \
            -max-bytes-regression 0.05 \
            -max-allocs-regression 0.05 \
            -require BenchmarkGCounterApplyDelta \
            -require BenchmarkRGAApplyDeltaLinearChain \
            -require BenchmarkProviderEndToEndRelayFanout/receivers_1 \
            -require BenchmarkProviderEndToEndRelayFanout/receivers_4 \
            -require BenchmarkProviderEndToEndRelayFanout/receivers_16

  docker:
    # Keep the container contract on every feature PR and beta candidate. The
    # beta-only main train makes a second identical image/coverage run wasteful.
    if: github.ref == 'refs/heads/beta' || (github.event_name == 'pull_request' && github.head_ref != 'beta')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docker-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run Go 1.26 coverage container
        run: |
          docker build --file Dockerfile.ci --tag crdt-ci:ci .
          docker run --rm --env COVERAGE_THRESHOLD=90 crdt-ci:ci

  golangci:
    if: github.event_name != 'pull_request' || github.head_ref != 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: golangci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The beta lint policy compares against origin/main. Fetching all
          # branches keeps that base available for push and PR validation.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9.0.0
        with:
          version: v2.11

  prerelease-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    needs: [test, staticcheck, coverage, docker, golangci]
    runs-on: ubuntu-latest
    concurrency:
      group: beta-prerelease-tag
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create pre-release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch --force origin refs/heads/beta:refs/remotes/origin/beta
          if [[ "$(git rev-parse origin/beta)" != "${GITHUB_SHA}" ]]; then
            echo "Skipping stale beta run for ${GITHUB_SHA}; beta now points to $(git rev-parse origin/beta)"
            echo "tag=skipped-stale" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          stable_tag="$(git tag --list --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [[ -z "${stable_tag}" ]]; then
            echo "No stable vMAJOR.MINOR.PATCH tag found" >&2
            exit 1
          fi

          version="${stable_tag#v}"
          IFS=. read -r major minor patch <<< "${version}"
          if [[ ! "${patch}" =~ ^[0-9]+$ ]]; then
            echo "Invalid stable tag: ${stable_tag}" >&2
            exit 1
          fi
          prefix="v${major}.${minor}.$((10#${patch} + 1))-beta."

          while IFS= read -r existing_tag; do
            if [[ "$(git rev-list -n 1 "${existing_tag}")" == "${GITHUB_SHA}" ]]; then
              echo "tag=${existing_tag}" >> "${GITHUB_OUTPUT}"
              echo "Pre-release tag already exists: ${existing_tag}"
              exit 0
            fi
          done < <(git tag --list "${prefix}*" --sort=-v:refname)

          max=0
          while IFS= read -r existing_tag; do
            number="${existing_tag#"${prefix}"}"
            if [[ "${number}" =~ ^[0-9]+$ ]] && (( 10#${number} > max )); then
              max=$((10#${number}))
            fi
          done < <(git tag --list "${prefix}*")

          tag="${prefix}$((max + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" --message "Pre-release ${tag}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Report pre-release tag
        run: 'echo "Pre-release tag result: ${{ steps.tag.outputs.tag }}"'

  release-tag:
    # This one bootstrap PR installs the beta-only main gate directly, so it
    # must not consume a stable release version before the gate is active.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'ci: bootstrap beta-only main release train')
    # Docker validation is complete on the promoted beta source. Keep the
    # main release fence on the checks that still run for its merge commit.
    needs: [test, staticcheck, coverage, golangci]
    runs-on: ubuntu-latest
    concurrency:
      group: main-release-tag
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch --force origin refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "Skipping stale main run for ${GITHUB_SHA}; main now points to $(git rev-parse origin/main)"
            echo "tag=skipped-stale" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          stable_tag="$(git tag --list --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [[ -z "${stable_tag}" ]]; then
            echo "No stable vMAJOR.MINOR.PATCH tag found" >&2
            exit 1
          fi

          version="${stable_tag#v}"
          IFS=. read -r major minor patch <<< "${version}"
          if [[ ! "${patch}" =~ ^[0-9]+$ ]]; then
            echo "Invalid stable tag: ${stable_tag}" >&2
            exit 1
          fi
          tag="v${major}.${minor}.$((10#${patch} + 1))"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "${tag}")"
            if [[ "${tagged_commit}" == "${GITHUB_SHA}" ]]; then
              echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
              echo "Release tag already exists for this commit: ${tag}"
              exit 0
            fi
            echo "Refusing to replace ${tag}, which points to ${tagged_commit}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" --message "Release ${tag}"
          git push origin "${tag}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release already exists for ${tag}"
          else
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "${tag}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Report release tag
        run: 'echo "Release tag result: ${{ steps.tag.outputs.tag }}"'
