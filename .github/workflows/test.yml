name: Test

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.26.x"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests
        run: go test ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Fuzz decoders
        run: |
          go test -run=^$ -fuzz=Fuzz -fuzztime=10s ./encoding
          go test -run=^$ -fuzz=FuzzGCounterUnmarshalBinary -fuzztime=10s ./counter
          go test -run=^$ -fuzz=FuzzPNCounterUnmarshalBinary -fuzztime=10s ./counter
          go test -run=^$ -fuzz=Fuzz -fuzztime=10s ./set
          go test -run=^$ -fuzz=Fuzz -fuzztime=10s ./delta

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2026.1"
          min-go-version: "1.26"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.26.x"
      - name: Enforce per-package coverage
        run: make coverage

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and run Go 1.26 coverage container
        run: |
          docker build --file Dockerfile.ci --tag crdt-ci:ci .
          docker run --rm --env COVERAGE_THRESHOLD=90 crdt-ci:ci

  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.26.x"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9.0.0
        with:
          version: v2.11

  prerelease-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    needs: [test, staticcheck, coverage, docker, golangci]
    runs-on: ubuntu-latest
    concurrency:
      group: beta-prerelease-tag
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Create pre-release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          stable_tag="$(git tag --list --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [[ -z "${stable_tag}" ]]; then
            echo "No stable vMAJOR.MINOR.PATCH tag found" >&2
            exit 1
          fi

          version="${stable_tag#v}"
          IFS=. read -r major minor patch <<< "${version}"
          if [[ ! "${patch}" =~ ^[0-9]+$ ]]; then
            echo "Invalid stable tag: ${stable_tag}" >&2
            exit 1
          fi
          prefix="v${major}.${minor}.$((10#${patch} + 1))-beta."

          while IFS= read -r existing_tag; do
            if [[ "$(git rev-list -n 1 "${existing_tag}")" == "${GITHUB_SHA}" ]]; then
              echo "tag=${existing_tag}" >> "${GITHUB_OUTPUT}"
              echo "Pre-release tag already exists: ${existing_tag}"
              exit 0
            fi
          done < <(git tag --list "${prefix}*" --sort=-v:refname)

          max=0
          while IFS= read -r existing_tag; do
            number="${existing_tag#"${prefix}"}"
            if [[ "${number}" =~ ^[0-9]+$ ]] && (( 10#${number} > max )); then
              max=$((10#${number}))
            fi
          done < <(git tag --list "${prefix}*")

          tag="${prefix}$((max + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" --message "Pre-release ${tag}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Report pre-release tag
        run: echo "Created pre-release tag ${{ steps.tag.outputs.tag }}"
