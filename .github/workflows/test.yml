name: Test

on:
  # The complete release-candidate suite runs exactly once: for the merge
  # candidate of the repository's beta -> preprod pull request. Daily beta
  # pushes deliberately do not start this workflow.
  pull_request:
    branches:
      - preprod
    types: [opened, synchronize, reopened, ready_for_review, closed]
  # Use this only to rerun an individual failed check. Select preprod as the
  # workflow ref so the retry examines the release-candidate source.
  workflow_dispatch:
    inputs:
      suite:
        description: Check to run (all is for an exceptional full revalidation)
        required: true
        default: all
        type: choice
        options:
          - all
          - test
          - wasm
          - race
          - vet
          - fuzz
          - staticcheck
          - coverage
          - performance
          - docker
          - golangci
      performance_baseline:
        description: "Baseline ref or SHA for a manual performance retry (default: preprod)"
        required: false
        default: preprod
        type: string

permissions:
  contents: read

jobs:
  test:
    name: test
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.suite == 'all' || inputs.suite == 'test'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: test-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Verify generated protocol registry
        run: make generate && git diff --exit-code -- type_ids_generated.go clients/typescript/src/type_ids.generated.ts
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests
        run: make test

  wasm:
    name: wasm
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.suite == 'all' || inputs.suite == 'wasm'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: wasm-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Run TypeScript and Go Wasm compatibility tests
        run: make wasm-test

  race:
    name: race
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.suite == 'all' || inputs.suite == 'race'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: race-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Run race detector
        run: make race

  vet:
    name: vet
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.suite == 'all' || inputs.suite == 'vet'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: vet-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Run vet
        run: make vet

  fuzz:
    name: fuzz
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.suite == 'all' || inputs.suite == 'fuzz'))
    runs-on: ubuntu-latest
    # The suite is bounded but still needs headroom for corpus minimization.
    timeout-minutes: 20
    concurrency:
      group: fuzz-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Fuzz decoders
        run: make fuzz

  staticcheck:
    name: staticcheck
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.suite == 'all' || inputs.suite == 'staticcheck'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: staticcheck-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Run staticcheck across Go modules
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          make staticcheck

  coverage:
    name: coverage
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.suite == 'all' || inputs.suite == 'coverage'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: coverage-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Enforce per-package coverage
        run: make coverage

  performance:
    name: performance
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.suite == 'all' || inputs.suite == 'performance'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: performance-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Select comparison baseline
        id: baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PERFORMANCE_BASELINE: ${{ inputs.performance_baseline }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            baseline="${PR_BASE_SHA}"
          else
            git fetch --force origin "${PERFORMANCE_BASELINE}"
            baseline="$(git rev-parse FETCH_HEAD)"
          fi
          echo "sha=${baseline}" >> "${GITHUB_OUTPUT}"
      - name: Check out comparison baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: .benchmark-baseline
      - name: Compare controlled benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .benchmark-results
          baseline_dir="${RUNNER_TEMP}/crdt-benchmark-baseline"
          mv .benchmark-baseline "${baseline_dir}"
          benchmark_args=(
            -run='^$'
            -bench='^(BenchmarkGCounterApplyDelta|BenchmarkRGAApplyDeltaLinearChain|BenchmarkProviderEndToEndRelayFanout)$'
            -benchmem
            -benchtime=100ms
            -count=5
            -cpu=1
            ./counter
            ./text
            ./examples/websocket-provider/provider
          )
          if [[ -f "${baseline_dir}/examples/go.mod" ]]; then
            (
              cd "${baseline_dir}"
              # The checkout was moved outside the candidate before this
              # command, so its own go.work cannot resolve candidate code.
              GOMAXPROCS=1 go test "${benchmark_args[@]:0:8}" ./counter ./text
            ) > .benchmark-results/baseline.txt
            (
              cd "${baseline_dir}/examples"
              GOMAXPROCS=1 go test -run='^$' -bench='^BenchmarkProviderEndToEndRelayFanout$' -benchmem -benchtime=100ms -count=5 -cpu=1 ./websocket-provider/provider
            ) >> .benchmark-results/baseline.txt
          else
            (
              cd "${baseline_dir}"
              GOMAXPROCS=1 go test "${benchmark_args[@]}"
            ) > .benchmark-results/baseline.txt
          fi
          GOMAXPROCS=1 go test "${benchmark_args[@]:0:8}" ./counter ./text > .benchmark-results/candidate.txt
          (
            cd examples
            GOMAXPROCS=1 go test -run='^$' -bench='^BenchmarkProviderEndToEndRelayFanout$' -benchmem -benchtime=100ms -count=5 -cpu=1 ./websocket-provider/provider
          ) >> .benchmark-results/candidate.txt
          go run ./cmd/crdt-benchmark-check \
            -base .benchmark-results/baseline.txt \
            -candidate .benchmark-results/candidate.txt \
            -minimum-samples 5 \
            -max-time-regression 1.00 \
            -max-bytes-regression 0.05 \
            -max-allocs-regression 0.05 \
            -require BenchmarkGCounterApplyDelta \
            -require BenchmarkRGAApplyDeltaLinearChain \
            -require BenchmarkProviderEndToEndRelayFanout/receivers_1 \
            -require BenchmarkProviderEndToEndRelayFanout/receivers_4 \
            -require BenchmarkProviderEndToEndRelayFanout/receivers_16

  docker:
    name: docker
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.suite == 'all' || inputs.suite == 'docker'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docker-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run Go 1.26 coverage container
        run: |
          docker build --file Dockerfile.ci --tag crdt-ci:ci .
          docker run --rm --env COVERAGE_THRESHOLD=90 crdt-ci:ci

  golangci:
    name: golangci
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.suite == 'all' || inputs.suite == 'golangci'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: golangci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The candidate lint policy compares against origin/main.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Run golangci-lint across Go modules
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.0
          make lint

  prerelease-tag:
    # Full checks are required by preprod branch protection. Tag only the
    # dependency-free root candidate here; the first split release publishes
    # nested modules from the stable tag, where their pinned stable-root
    # requirement is resolvable. No duplicate test run is needed after its
    # source tree has already been validated.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'beta'
    runs-on: ubuntu-latest
    concurrency:
      group: preprod-prerelease-tag
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Create pre-release tag
        id: tag
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch --force origin refs/heads/preprod:refs/remotes/origin/preprod
          if [[ "$(git rev-parse origin/preprod)" != "${CANDIDATE_SHA}" ]]; then
            echo "Skipping stale preprod merge ${CANDIDATE_SHA}; preprod now points to $(git rev-parse origin/preprod)"
            echo "tag=skipped-stale" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          stable_tag="$(git tag --list --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [[ -z "${stable_tag}" ]]; then
            echo "No stable vMAJOR.MINOR.PATCH tag found" >&2
            exit 1
          fi

          version="${stable_tag#v}"
          IFS=. read -r major minor patch <<< "${version}"
          if [[ ! "${patch}" =~ ^[0-9]+$ ]]; then
            echo "Invalid stable tag: ${stable_tag}" >&2
            exit 1
          fi
          prefix="v${major}.${minor}.$((10#${patch} + 1))-beta."

          while IFS= read -r existing_tag; do
            if [[ "$(git rev-list -n 1 "${existing_tag}")" == "${CANDIDATE_SHA}" ]]; then
              echo "tag=${existing_tag}" >> "${GITHUB_OUTPUT}"
              echo "Pre-release tag already exists: ${existing_tag}"
              exit 0
            fi
          done < <(git tag --list "${prefix}*" --sort=-v:refname)

          max=0
          while IFS= read -r existing_tag; do
            number="${existing_tag#"${prefix}"}"
            if [[ "${number}" =~ ^[0-9]+$ ]] && (( 10#${number} > max )); then
              max=$((10#${number}))
            fi
          done < <(git tag --list "${prefix}*")

          tag="${prefix}$((max + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" "${CANDIDATE_SHA}" --message "Pre-release ${tag}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Report pre-release tag
        run: 'echo "Pre-release tag result: ${{ steps.tag.outputs.tag }}"'
