[package]
name = "darkinno-tech-crdt-rga"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Bounded native Rust implementation of darkinno-tech RGA run-v2 and LWW-Map v1"
repository = "https://github.com/darkinno-tech/crdt"
keywords = ["crdt", "rga", "collaboration", "replication"]
categories = ["data-structures", "encoding"]

[lib]
name = "darkinno-tech_crdt_rga"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["ffi"]
ffi = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[[bench]]
name = "rga"
harness = false
