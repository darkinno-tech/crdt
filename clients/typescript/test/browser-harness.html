<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRDT RGA Wasm browser verification</title>
  </head>
  <body>
    <main>
      <h1>CRDT RGA Wasm browser verification</h1>
      <p id="status" role="status">Starting…</p>
    </main>
    <script>
      window.__consoleErrors = [];
      const originalConsoleError = console.error.bind(console);
      console.error = (...args) => {
        window.__consoleErrors.push(args.map(String).join(" "));
        originalConsoleError(...args);
      };
    </script>
    <script src="/.tmp/crdt-rga-wasm/wasm_exec.js"></script>
    <script type="module">
      import {
        BroadcastChannelNativeTransport,
        createBrowserReplicaID,
        decodeFrame,
        FrameType,
        IndexedDBRGAWasmPersistence,
        initRGAWasm,
        openNativeBrowserDocument,
        openRGAWasmBrowserDocument,
      } from "../dist/index.js";

      const status = document.querySelector("#status");
      try {
        const runtime = await initRGAWasm({ wasmURL: "/.tmp/crdt-rga-wasm/crdt-rga.wasm" });
        const alice = runtime.create("browser-alice");
        const bob = runtime.create("browser-bob");
        const delta = alice.insert(0, "browser local merge");
        const frame = decodeFrame(delta);
        if (frame.typeID !== FrameType.RGARunDelta) {
          throw new Error("unexpected RGA delta type");
        }
        bob.applyDelta(delta);
        const snapshot = bob.snapshot();
        const restored = runtime.restore(snapshot);
        const text = restored.text();
        if (text !== "browser local merge") {
          throw new Error(`unexpected restored text: ${text}`);
        }
        alice.close();
        bob.close();
        restored.close();

        const documentID = `browser-native-${crypto.randomUUID()}`;
        const persisted = await openNativeBrowserDocument({
          documentID,
          replicaID: createBrowserReplicaID(),
        });
        persisted.getMap("metadata").set("title", "offline browser state");
        await persisted.flush();
        await persisted.close();
        const recovered = await openNativeBrowserDocument({
          documentID,
          replicaID: createBrowserReplicaID(),
        });
        if (recovered.getMap("metadata").get("title") !== "offline browser state") {
          throw new Error("IndexedDB recovery lost native state");
        }
        await recovered.close();

        const rgaDocumentID = `browser-wasm-rga-${crypto.randomUUID()}`;
        const rgaReplicaID = createBrowserReplicaID("rga");
        const rgaPersistence = await IndexedDBRGAWasmPersistence.open(`browser-wasm-rga-db-${crypto.randomUUID()}`);
        const rgaPersisted = await openRGAWasmBrowserDocument({
          documentID: rgaDocumentID,
          replicaID: rgaReplicaID,
          runtime,
          persistence: rgaPersistence,
        });
        const rgaMutations = 128;
        const rgaAppendStarted = performance.now();
        for (let index = 0; index < rgaMutations; index += 1) {
          rgaPersisted.insert(index, "x");
          await rgaPersisted.flush();
        }
        const rgaAppendMs = performance.now() - rgaAppendStarted;
        await rgaPersisted.close();
        const rgaRecoveryStarted = performance.now();
        const rgaRecovered = await openRGAWasmBrowserDocument({
          documentID: rgaDocumentID,
          replicaID: rgaReplicaID,
          runtime,
          persistence: rgaPersistence,
        });
        const rgaRecoveryMs = performance.now() - rgaRecoveryStarted;
        if (Array.from(rgaRecovered.text()).length !== rgaMutations) {
          throw new Error("IndexedDB recovery lost Wasm RGA state");
        }
        await rgaRecovered.close();
        rgaPersistence.close();

        const channelName = `browser-native-channel-${crypto.randomUUID()}`;
        const leftTransport = new BroadcastChannelNativeTransport(channelName);
        const rightTransport = new BroadcastChannelNativeTransport(channelName);
        const left = await openNativeBrowserDocument({
          documentID: `${documentID}-tabs`,
          replicaID: createBrowserReplicaID(),
          transport: leftTransport,
        });
        const right = await openNativeBrowserDocument({
          documentID: `${documentID}-tabs`,
          replicaID: createBrowserReplicaID(),
          transport: rightTransport,
        });
        left.getArray("cards").push(["shared across tabs"]);
        await left.flush();
        await waitFor(() => right.getArray("cards").get(0) === "shared across tabs");
        await right.flush();
        await left.close();
        await right.close();
        leftTransport.close();
        rightTransport.close();

        window.__crdtWasmResult = {
          ok: true,
          text,
          native: "IndexedDB + BroadcastChannel",
          rga: { mutations: rgaMutations, appendMs: rgaAppendMs, recoveryMs: rgaRecoveryMs },
        };
        status.textContent = `PASS: ${text}; native + Wasm RGA IndexedDB recovery; BroadcastChannel`;
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        window.__crdtWasmResult = { ok: false, error: message };
        console.error(message);
        status.textContent = `FAIL: ${message}`;
      }

      async function waitFor(predicate) {
        const deadline = performance.now() + 2_000;
        while (!predicate()) {
          if (performance.now() >= deadline) throw new Error("cross-tab native update timed out");
          await new Promise((resolve) => setTimeout(resolve, 10));
        }
      }
    </script>
  </body>
</html>
